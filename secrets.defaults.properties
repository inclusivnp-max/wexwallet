# Конфигурация по умолчанию. ЭТОТ ФАЙЛ КОММИТИТСЯ В РЕПОЗИТОРИЙ.
#
# Он выполняет две роли:
#   1. задаёт публичные значения, с которыми приложение работает "из коробки";
#   2. служит схемой: ключ, которого здесь нет, нельзя задать в secrets.properties.
#
# Личные ключи сюда не пишутся никогда. Для них есть secrets.properties
# (в .gitignore), см. secrets.properties.example.
#
# Пустое значение — это не ошибка сборки. Приложение обязано работать без ключа,
# отключив соответствующую функцию с понятным сообщением пользователю.

# --- Ключи сторонних сервисов (по умолчанию не заданы) --------------------
# История транзакций и обнаружение токенов, один ключ на 60+ EVM-сетей.
ETHERSCAN_API_KEY=
# Котировки. Без ключа работает публичный тариф с жёстким лимитом запросов.
COINGECKO_API_KEY=
# Подключение к dApp по WalletConnect (этап 8).
WALLETCONNECT_PROJECT_ID=

# --- Публичные RPC-эндпоинты EVM ------------------------------------------
# Значения по умолчанию намеренно бесключевые: чистый клон должен работать.
RPC_ETHEREUM=https://ethereum-rpc.publicnode.com
RPC_BASE=https://base-rpc.publicnode.com
RPC_ARBITRUM=https://arbitrum-one-rpc.publicnode.com
RPC_OPTIMISM=https://optimism-rpc.publicnode.com
RPC_POLYGON=https://polygon-bor-rpc.publicnode.com
RPC_BSC=https://bsc-rpc.publicnode.com

# --- EVM тестнеты ---------------------------------------------------------
RPC_BASE_SEPOLIA=https://base-sepolia-rpc.publicnode.com

# --- Остальные сети --------------------------------------------------------
RPC_SOLANA=https://api.mainnet-beta.solana.com
BITCOIN_ESPLORA_URL=https://blockstream.info/api
BITCOIN_MEMPOOL_URL=https://mempool.space/api
TON_API_URL=https://toncenter.com/api/v2
