name: CI

on:
  push:
    branches: [main]
  pull_request:

# Права по умолчанию урезаны: сборке не нужно ничего, кроме чтения кода.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установить JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v5

      # Ключевая проверка открытого репозитория: секреты не подставляются
      # намеренно. Если сборка без них сломается, значит сломано обещание
      # "клонировал и собрал", и это должно падать в CI, а не у контрибьютора.
      - name: Сборка без единого секрета
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Статический анализ (detekt)
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Релизная сборка с R8
        run: ./gradlew assembleRelease --stacktrace

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          retention-days: 7

  secrets-scan:
    name: Поиск утечек секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks проверяет историю, а не только последний коммит.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
