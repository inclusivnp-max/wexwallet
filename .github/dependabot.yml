version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Обновления криптографических библиотек не сваливаем в общую кучу:
    # они требуют отдельного внимательного ревью.
    groups:
      androidx:
        patterns: ["androidx.*"]
      testing:
        patterns: ["junit*", "org.jetbrains.kotlinx:kotlinx-coroutines-test"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
